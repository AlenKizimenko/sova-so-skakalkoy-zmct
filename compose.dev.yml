services:
  # Local inference: model must be pulled once; see docs/experiments/delivery-ollama.md.
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend-net
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama pull qwen2.5:1.5b &&
      wait
      "
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # === База данных ===
  db:
    image: postgres:16-alpine
    container_name: event_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-event_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis (кеш и очередь) ===
  redis:
    image: redis:7-alpine
    container_name: event_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === API Gateway (Nginx) ===
  api-gateway:
    image: nginx:alpine
    container_name: event_platform_api_gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - extractor
      - page-composer
      - vk-publisher
      - mailer

  # === Extractor ===
  extractor:
    build:
      context: ./services/extractor
      dockerfile: Dockerfile
    container_name: event_platform_extractor
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      DATABASE_URL: postgresql://event_platform:changeme@db:5432/event_platform
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === VK Publisher ===
  vk-publisher:
    build:
      context: ./services/vk-publisher
      dockerfile: Dockerfile
    container_name: event_platform_vk_publisher
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Mailer ===
  mailer:
    build:
      context: ./services/mailer
      dockerfile: Dockerfile
    container_name: event_platform_mailer
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Page Composer ===
  page-composer:
    build:
      context: ./services/page-composer
      dockerfile: Dockerfile
    container_name: event_platform_page_composer
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Frontend (Next.js) ===
  site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_platform_site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:3000"
    environment:
      EXTRACTOR_URL: http://extractor:8000
      COMPOSER_URL: http://page-composer:8000
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - extractor
      - page-composer

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  ollama_data:
